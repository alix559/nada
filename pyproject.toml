[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nada"
dynamic = ["version"]
description = "Wav2vec 2.0 speech recognition on Modular MAX"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Alex", email = "alixjcob559@gmail.com"}]
keywords = ["wav2vec2", "speech", "asr", "max"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "numpy>=1.26",
    "safetensors>=0.4",
    "huggingface_hub>=0.26",
]

[project.urls]
Repository = "https://github.com/alix559/nada"
Documentation = "https://alix559.github.io/nada/"

[project.entry-points.nbdev]
nada = "nada._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "nada.__version__"}

[tool.setuptools.packages.find]
include = ["nada"]

[tool.nbdev]
lib_path = "nada"
nbs_path = "nbs"
doc_path = "_docs"
