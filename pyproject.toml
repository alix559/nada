[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nada"
dynamic = ["version"]
description = "LAION CLAP, the unfused HTSAT and RoBERTa model, on Modular MAX"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Alex", email = "alixjcob559@gmail.com"}]
keywords = ["clap", "audio", "max"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "numpy>=1.26",
    "safetensors>=0.4",
    "huggingface_hub>=0.26",
    "tokenizers>=0.20",
]

[tool.setuptools.dynamic]
version = {attr = "nada.__version__"}

[tool.setuptools.packages.find]
include = ["nada"]
