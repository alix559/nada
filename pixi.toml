[workspace]
authors = ["Alex <alixjcob559@gmail.com>"]
channels = ["https://conda.modular.com/max/", "conda-forge"]
name = "nada"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
smoke = { cmd = "python -m nada.smoke", description = "Compile a tiny Audio-JEPA graph and check that it runs" }
embed = { cmd = "python -m nada.model", description = "Embed WAV files: pixi run embed clip.wav" }
center = { cmd = "python -c \"from nada.model import build, compile_model, load_checkpoint, make_center; m = build(); load_checkpoint(m); make_center(m, compile_model(m, batch=1))\"", description = "Write models/embed_center.npy from synthetic clips" }
nbdev-export = { cmd = "nbdev-export", description = "Export notebooks into the nada package" }

[dependencies]
mojo = ">=1.1.0,<2"
max = ">=26.6.0,<27"
nbdev = ">=3.3.26,<4"
numpy = ">=1.26"
huggingface_hub = ">=0.26"
safetensors = ">=0.4"
jupyter = ">=1.1.1,<2"

[pypi-dependencies]
nada = { path = ".", editable = true }

[feature.reference.dependencies]
pytorch = ">=2.5"
torchaudio = ">=2.5"

[feature.reference.tasks]
convert = { cmd = "python -m nada.download", description = "Download ltuncay/Audio-JEPA and write a safetensors checkpoint (needs PyTorch to read the .ckpt)" }
parity = { cmd = "python -m nada.parity", description = "Compare the MAX graph and the log-mel frontend with PyTorch and torchaudio" }

[environments]
default = { solve-group = "default" }
reference = { features = ["reference"], solve-group = "default" }
